<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Invest Pro Ultimate</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f1f5f9; --card-bg: #ffffff; --text: #0f172a; --text-light: #64748b; --success: #16a34a; --danger: #dc2626; --border: #e2e8f0; --gold: #ca8a04; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); padding: 12px; padding-bottom: 40px; }
        
        /* HEADER */
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; margin-bottom: 15px; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .app-icon { width: 40px; height: 40px; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; border-radius: 12px; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2); }
        .app-title { font-size: 1.4rem; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
        .usd-badge { background: #dbeafe; color: var(--primary); padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; }

        /* DASHBOARD */
        .grid-dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 18px; margin-bottom: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: 0.3s; }
        .card-res { border-left: 5px solid var(--border); }
        small { font-size: 0.72rem; text-transform: uppercase; color: var(--text-light); font-weight: bold; display: block; margin-bottom: 8px; }
        .value { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.5px; }

        .chart-container { position: relative; height: 260px; width: 100%; margin: 10px 0; }

        /* REBALANCEAMENTO */
        .reb-header { background: #fef9c3; color: var(--gold); padding: 10px; border-radius: 10px; font-weight: 800; font-size: 0.82rem; margin-bottom: 10px; }
        .rebalance-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--border); }
        .tag-buy { background: #dcfce7; color: #15803d; padding: 6px 10px; border-radius: 8px; font-size: 0.72rem; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
        .tag-buy:active { transform: scale(0.9); background: #bbf7d0; }

        /* FORM */
        .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: #f8fafc; font-size: 0.95rem; outline: none; }
        .btn-group { display: flex; gap: 8px; }
        button { flex: 2; background: var(--primary); color: #fff; padding: 15px; border: none; border-radius: 12px; font-weight: bold; font-size: 1rem; }
        button.secondary { flex: 1; background: #e2e8f0; color: var(--text-light); }

        /* LISTA ATIVOS */
        table { width: 100%; border-collapse: collapse; }
        td { padding: 12px 0; border-bottom: 1px solid var(--border); }
        .lp-tag { font-size: 0.75rem; font-weight: bold; display: block; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="brand">
            <div class="app-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="width:20px;height:20px;"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg></div>
            <h1 class="app-title">Invest Pro</h1>
        </div>
        <div id="usd-rate" class="usd-badge">US$ 0.00</div>
    </div>

    <div class="grid-dashboard">
        <div class="card card-res" id="card-equity"><small>Patrimônio</small><div class="value" id="total-equity">R$ 0,00</div></div>
        <div class="card card-res" id="card-pl"><small>Lucro Total</small><div class="value" id="total-pl">R$ 0,00</div></div>
    </div>

    <div class="card"><small>Distribuição da Carteira</small><div class="chart-container"><canvas id="allocationChart"></canvas></div></div>

    <div class="card"><small>Rebalanceamento Estratégico</small><div id="rebalance-container"></div></div>

    <div class="card">
        <small>Nova Operação</small>
        <form id="tradeForm">
            <input type="text" id="ativo" placeholder="Ativo (Ex: PETR4, AAPL)" required style="text-transform: uppercase; margin-bottom: 8px;">
            <div class="form-row">
                <select id="classe"><option value="Acoes">Ações</option><option value="FIIs">FIIs</option><option value="Internacional">Exterior</option><option value="RendaFixa">Renda Fixa</option></select>
                <select id="moeda"><option value="BRL">BRL</option><option value="USD">USD</option></select>
            </div>
            <div class="form-row">
                <input type="number" id="quantidade" placeholder="Qtd" required step="any">
                <input type="number" id="preco" placeholder="Preço Pago" step="any">
            </div>
            <select id="tipo" style="margin-bottom: 8px;"><option value="C">Compra</option><option value="V">Venda</option></select>
            <div class="btn-group">
                <button type="submit" id="btnSave">Salvar</button>
                <button type="reset" class="secondary">Limpar</button>
            </div>
        </form>
    </div>

    <div class="card"><small>Minhas Posições</small><table><tbody id="assets-body"></tbody></table></div>

<script>
    const SHEET_ID = '1qGy-7cNRnwgqPNhDP-KEPns_XJ1BuKVbYczwqt_lSMM'; 
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxGf_LIa5DVJOKFebCVsU09zy01JKPTZZ-dolKJW2Yrz6HS8t5z5EjocLCvOm36OymL/exec';
    let usdRate = 5.00, allocationChart = null;

    window.onload = loadData;

    async function loadData() {
        try {
            const qUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=COTACOES`;
            const oUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=OPERACOES`;
            const [rQ, rO] = await Promise.all([fetch(qUrl).then(r => r.text()), fetch(oUrl).then(r => r.text())]);
            const parse = (t) => JSON.parse(t.substr(47).slice(0, -2)).table.rows.map(r => r.c.map(c => c ? c.v : null));
            processData(parse(rO), parse(rQ));
        } catch (e) { alert("Planilha não encontrada."); }
    }

    function processData(ops, quotes) {
        let qData = {};
        quotes.forEach(r => { if(r[0]) qData[r[0].toString().trim().toUpperCase()] = { p: r[1] || 0 }; });
        if(qData['USD']) { usdRate = qData['USD'].p; document.getElementById('usd-rate').innerText = "US$ " + usdRate.toFixed(2); }

        let pos = {};
        ops.forEach(o => {
            let t = o[1].toString().trim().toUpperCase();
            if(!pos[t]) pos[t] = { qty: 0, cost: 0, classe: o[2], moeda: o[5] || 'BRL' };
            let q = parseFloat(o[3]);
            pos[t].qty += q;
            if(q > 0) pos[t].cost += q * (o[4] || 0);
        });
        render(pos, qData);
    }

    // MACETE: Função que sugere o valor exato
    function suggestValue(ticker, atual, media) {
        const falta = media - atual;
        if(falta > 0) {
            alert(`💡 Sugestão para ${ticker}:\nAporte R$ ${falta.toLocaleString('pt-BR', {minimumFractionDigits: 2})} para equilibrar este ativo na média da classe.`);
        } else {
            alert(`✅ ${ticker} está em dia com a média.`);
        }
    }

    function render(pos, qData) {
        let total = 0, totalCost = 0, alloc = {}, tbody = document.getElementById('assets-body');
        tbody.innerHTML = "";
        let assetDetails = [];

        Object.keys(pos).forEach(t => {
            if(pos[t].qty <= 0.001) return;
            const rate = (pos[t].moeda === 'USD' ? usdRate : 1);
            const val = pos[t].qty * (qData[t]?.p || 0) * rate;
            const costTotal = pos[t].cost * rate;
            const lp = val - costTotal;
            const pm = pos[t].cost / pos[t].qty;
            
            total += val; totalCost += costTotal;
            alloc[pos[t].classe] = (alloc[pos[t].classe] || 0) + val;
            assetDetails.push({ t, val, classe: pos[t].classe });

            tbody.innerHTML += `<tr>
                <td><b>${t}</b><br><small style="border:none; padding:0; font-size:0.65rem">PM: R$ ${pm.toLocaleString('pt-BR',{minimumFractionDigits:2})}</small></td>
                <td style="text-align:right">
                    <b>R$ ${val.toLocaleString('pt-BR',{minimumFractionDigits:2})}</b>
                    <span class="lp-tag" style="color:${lp >= 0 ? 'var(--success)' : 'var(--danger)'}">
                        ${lp >= 0 ? '▲' : '▼'} R$ ${Math.abs(lp).toLocaleString('pt-BR',{maximumFractionDigits:0})}
                    </span>
                </td>
            </tr>`;
        });

        document.getElementById('total-equity').innerText = "R$ " + total.toLocaleString('pt-BR', {maximumFractionDigits:0});
        const plTotal = total - totalCost;
        const plEl = document.getElementById('total-pl');
        plEl.innerText = "R$ " + plTotal.toLocaleString('pt-BR', {maximumFractionDigits:0});
        plEl.style.color = plTotal >= 0 ? 'var(--success)' : 'var(--danger)';
        document.getElementById('card-pl').style.borderLeftColor = plTotal >= 0 ? 'var(--success)' : 'var(--danger)';

        const ctx = document.getElementById('allocationChart').getContext('2d');
        if(allocationChart) allocationChart.destroy();
        allocationChart = new Chart(ctx, { type: 'doughnut', data: { labels: Object.keys(alloc), datasets: [{ data: Object.values(alloc), backgroundColor: ['#2563eb','#10b981','#f59e0b','#ef4444'], borderWidth: 2 }] }, options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } } });

        const container = document.getElementById('rebalance-container');
        let classes = Object.keys(alloc);
        if(classes.length > 0) {
            let mainClass = classes.reduce((p, c) => (alloc[p] < alloc[c] ? p : c));
            let assetsInClass = assetDetails.filter(a => a.classe === mainClass);
            let avgValue = alloc[mainClass] / assetsInClass.length;
            
            let sorted = assetsInClass.sort((a, b) => a.val - b.val).slice(0, 3);
            let h = `<div class="reb-header">Focar em: ${mainClass.toUpperCase()}</div>`;
            sorted.forEach(a => {
                h += `<div class="rebalance-item">
                        <b>${a.t}</b> 
                        <button class="tag-buy" onclick="suggestValue('${a.t}', ${a.val}, ${avgValue})">Aportar</button>
                      </div>`;
            });
            container.innerHTML = h;
        }
    }

    document.getElementById('tradeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSave'); btn.innerText = "Processando...";
        fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({
            ativo: document.getElementById('ativo').value.toUpperCase(),
            classe: document.getElementById('classe').value,
            quantidade: parseFloat(document.getElementById('quantidade').value) * (document.getElementById('tipo').value === 'V' ? -1 : 1),
            precoInfo: document.getElementById('preco').value,
            moeda: document.getElementById('moeda').value
        })}).then(() => location.reload());
    });
</script>
</body>
</html>
