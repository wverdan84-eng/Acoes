<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestor de Portfólio Pro</title>

    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc; /* Fundo mais suave */
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; } /* Max-width menor para parecer App */

        /* Header Moderno */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-top: 10px; }
        .header h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; color: var(--primary); }
        .dollar-badge { background: #eff6ff; color: var(--primary); padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }

        /* Cards Estilo iOS */
        .card {
            background: var(--card-bg);
            border-radius: 20px; /* Mais arredondado */
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); /* Sombra suave */
            border: 1px solid var(--border);
        }

        .card h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-light); margin-bottom: 10px; font-weight: 600; }

        /* Grid Dashboard */
        .grid-dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .value { font-size: 1.6rem; font-weight: 800; letter-spacing: -1px; }
        .sub-value { font-size: 0.85rem; color: var(--text-light); margin-top: 4px; font-weight: 500; }

        /* Formulários Touch-Friendly */
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.9rem; color: var(--text-light); }
        
        input, select {
            width: 100%;
            padding: 14px; /* Área de toque maior */
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            background: var(--bg);
            outline: none;
            transition: border-color 0.2s;
            appearance: none; /* Remove estilo nativo feio */
        }
        input:focus, select:focus { border-color: var(--primary); background: #fff; }

        /* Botão Grande */
        button#btnSave {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        button#btnSave:active { transform: scale(0.98); }

        /* Tabela Limpa */
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 100%; }
        th { text-align: left; color: var(--text-light); font-size: 0.75rem; padding-bottom: 10px; text-transform: uppercase; }
        td { padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        tr:last-child td { border-bottom: none; }
        
        /* Utilitários */
        .text-green { color: var(--success); }
        .text-red { color: var(--danger); }
        
        /* Tags de Balanceamento */
        .rebalance-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--border); }
        
        .tag { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .tag-buy { background: #dcfce7; color: #15803d; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Invest Pro</h1>
        <div class="dollar-badge" id="usd-rate">USD --</div>
    </div>

    <div class="grid-dashboard">
        <div class="card">
            <h3>Patrimônio</h3>
            <div class="value" id="total-equity">...</div>
        </div>
        <div class="card">
            <h3>Resultado</h3>
            <div class="value" id="total-pl">...</div>
            <div class="sub-value" id="total-pl-pct">--%</div>
        </div>
    </div>

    <div class="card">
        <h3>Alocação</h3>
        <div style="position: relative; height: 250px; width: 100%;">
            <canvas id="allocationChart"></canvas>
        </div>
    </div>

    <div class="card">
        <h3>Nova Operação</h3>
        <form id="tradeForm">
            <div class="form-group">
                <label>Ativo</label>
                <input type="text" id="ativo" placeholder="Ex: PETR4" required style="text-transform: uppercase;">
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>Tipo</label>
                    <select id="tipo" onchange="togglePriceField()">
                        <option value="C">Compra</option>
                        <option value="V">Venda</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Moeda</label>
                    <select id="moeda">
                        <option value="BRL">Real</option>
                        <option value="USD">Dólar</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Classe</label>
                <select id="classe" required>
                    <option value="Acoes">Ações</option>
                    <option value="FIIs">FIIs</option>
                    <option value="RendaFixa">Renda Fixa</option>
                    <option value="Internacional">Exterior</option>
                </select>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>Quantidade</label>
                    <input type="number" id="quantidade" step="0.01" placeholder="0" required>
                </div>
                <div class="form-group" id="div-preco">
                    <label>Preço (Opcional)</label>
                    <input type="number" id="preco" step="0.01" placeholder="R$ 0,00">
                </div>
            </div>

            <button type="submit" id="btnSave">Salvar</button>
        </form>
    </div>

    <div class="card">
        <h3>Rebalanceamento</h3>
        <div id="rebalance-list">
            <p style="color:var(--text-light); font-size: 0.9rem; text-align:center; padding:10px;">Carregando...</p>
        </div>
    </div>

    <div class="card">
        <h3>Meus Ativos</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Ativo</th>
                        <th style="text-align:right">Qtd</th>
                        <th style="text-align:right">Atual</th>
                        <th style="text-align:right">Total</th>
                    </tr>
                </thead>
                <tbody id="assets-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // CONFIGURAÇÃO
    const SHEET_ID = '1qGy-7cNRnwgqPNhDP-KEPns_XJ1BuKVbYczwqt_lSMM'; 
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxGf_LIa5DVJOKFebCVsU09zy01JKPTZZ-dolKJW2Yrz6HS8t5z5EjocLCvOm36OymL/exec';

    let usdRate = 5.00;
    let allocationChart = null;

    window.onload = () => { loadData(); };

    function togglePriceField() {
        const tipo = document.getElementById('tipo').value;
        const input = document.getElementById('preco');
        if (tipo === 'V') {
            input.value = '';
            input.disabled = true;
            input.placeholder = "Automático";
        } else {
            input.disabled = false;
            input.placeholder = "R$ 0,00";
        }
    }

    async function loadData() {
        try {
            const quotesUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=COTACOES`;
            const opsUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=OPERACOES`;

            const [quotesRes, opsRes] = await Promise.all([
                fetch(quotesUrl).then(r => r.text()),
                fetch(opsUrl).then(r => r.text())
            ]);

            const parseGviz = (text) => {
                const json = JSON.parse(text.substr(47).slice(0, -2));
                return json.table.rows.map(row => row.c.map(cell => cell ? cell.v : null));
            };

            processData(parseGviz(opsRes), parseGviz(quotesRes));

        } catch (error) {
            console.error(error);
            document.getElementById('rebalance-list').innerHTML = '<p style="color:red">Erro ao carregar dados.</p>';
        }
    }

    function processData(ops, quotes) {
        let quotesData = {};
        quotes.forEach(row => { if(row[0]) quotesData[row[0]] = { price: row[1], currency: row[2] }; });

        if (quotesData['USD']) usdRate = quotesData['USD'].price;
        document.getElementById('usd-rate').innerText = `US$ ${usdRate.toFixed(2)}`;

        let positions = {};

        ops.forEach(op => {
            const ativo = op[1];
            const classe = op[2];
            const qtd = parseFloat(op[3]);
            const precoInfo = op[4];
            const moeda = op[5];

            if (!positions[ativo]) positions[ativo] = { qty: 0, avgPrice: 0, classe: classe, currency: moeda };
            let p = positions[ativo];

            if (qtd > 0) { 
                const oldTotal = p.qty * p.avgPrice;
                const purchasePrice = precoInfo ? parseFloat(precoInfo) : p.avgPrice;
                const newTotal = oldTotal + (qtd * purchasePrice);
                p.qty += qtd;
                p.avgPrice = p.qty > 0 ? newTotal / p.qty : 0;
            } else { 
                p.qty += qtd; 
            }
        });

        renderInterface(positions, quotesData);
    }

    function renderInterface(positions, quotesData) {
        const tbody = document.getElementById('assets-body');
        tbody.innerHTML = '';

        let totalEquityBRL = 0;
        let totalCostBRL = 0;
        let classAlloc = {};

        Object.keys(positions).forEach(ticker => {
            const p = positions[ticker];
            if (p.qty <= 0.001) return;

            const quote = quotesData[ticker] ? quotesData[ticker].price : 0;
            const isUSD = p.currency === 'USD';
            const currentPriceBRL = isUSD ? quote * usdRate : quote;
            const totalValueBRL = p.qty * currentPriceBRL;
            const totalCostPosBRL = p.qty * (isUSD ? p.avgPrice * usdRate : p.avgPrice);

            totalEquityBRL += totalValueBRL;
            totalCostBRL += totalCostPosBRL;

            if (!classAlloc[p.classe]) classAlloc[p.classe] = 0;
            classAlloc[p.classe] += totalValueBRL;

            const profit = totalValueBRL - totalCostPosBRL;
            const profitClass = profit >= 0 ? 'text-green' : 'text-red';
            const symbol = isUSD ? 'US$' : 'R$';

            const tr = `
                <tr>
                    <td><strong>${ticker}</strong><br><small style="color:var(--text-light)">${p.classe}</small></td>
                    <td style="text-align:right">${p.qty.toFixed(2)}</td>
                    <td style="text-align:right">${symbol} ${quote.toFixed(2)}</td>
                    <td style="text-align:right">
                        <strong>R$ ${totalValueBRL.toLocaleString('pt-BR', {minimumFractionDigits: 0})}</strong><br>
                        <small class="${profitClass}">${profit >= 0 ? '+' : ''}${profit.toLocaleString('pt-BR', {minimumFractionDigits: 0})}</small>
                    </td>
                </tr>
            `;
            tbody.innerHTML += tr;
        });

        const fmtBRL = (v) => v.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
        document.getElementById('total-equity').innerText = fmtBRL(totalEquityBRL);
        
        const totalPL = totalEquityBRL - totalCostBRL;
        const totalPLPct = totalCostBRL > 0 ? (totalPL / totalCostBRL) * 100 : 0;
        const plEl = document.getElementById('total-pl');
        
        plEl.innerText = fmtBRL(totalPL);
        plEl.className = totalPL >= 0 ? 'value text-green' : 'value text-red';
        document.getElementById('total-pl-pct').innerText = `${totalPLPct.toFixed(2)}%`;

        renderChart(classAlloc);
        renderRebalance(totalEquityBRL, classAlloc);
    }

    function renderChart(alloc) {
        const ctx = document.getElementById('allocationChart').getContext('2d');
        if (allocationChart) allocationChart.destroy();
        
        allocationChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(alloc),
                datasets: [{
                    data: Object.values(alloc),
                    backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444'],
                    borderWidth: 0
                }]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, // O SEGREDO DO GRÁFICO RESPONSIVO
                plugins: { legend: { position: 'right', labels: { boxWidth: 12 } } } 
            }
        });
    }

    function renderRebalance(total, alloc) {
        const container = document.getElementById('rebalance-list');
        container.innerHTML = '';
        const targetPct = 0.25; 
        const types = ["Acoes", "FIIs", "RendaFixa", "Internacional"];
        
        let hasSuggestion = false;

        types.forEach(type => {
            const currentVal = alloc[type] || 0;
            const diff = (total * targetPct) - currentVal;
            if (diff > 50) { // Só mostra se a diferença for > R$ 50
                hasSuggestion = true;
                container.innerHTML += `
                    <div class="rebalance-item">
                        <div><strong>${type}</strong></div>
                        <div>
                            <span class="tag tag-buy">Aportar R$ ${diff.toLocaleString('pt-BR', {minimumFractionDigits: 0})}</span>
                        </div>
                    </div>
                `;
            }
        });
        
        if(!hasSuggestion) container.innerHTML = '<div style="text-align:center; color:#999; padding:10px;">Carteira Equilibrada! ✅</div>';
    }

    // Envio de Form (Simplificado)
    document.getElementById('tradeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSave');
        const oldTxt = btn.innerText;
        btn.innerText = 'Salvando...'; btn.disabled = true;

        const qtd = parseFloat(document.getElementById('quantidade').value) * (document.getElementById('tipo').value === 'V' ? -1 : 1);
        
        fetch(WEB_APP_URL, {
            method: 'POST', mode: 'no-cors',
            body: JSON.stringify({
                ativo: document.getElementById('ativo').value,
                classe: document.getElementById('classe').value,
                quantidade: qtd,
                precoInfo: document.getElementById('preco').value,
                moeda: document.getElementById('moeda').value
            })
        }).then(() => {
            alert('Salvo!'); document.getElementById('tradeForm').reset(); loadData();
        }).finally(() => { btn.innerText = oldTxt; btn.disabled = false; });
    });
</script>
</body>
</html>
